<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="'Segoe UI', Arial, sans-serif">

  <title>Banking Fraud KG — OWL Ontology Class Hierarchy</title>
  <desc>OWL class hierarchy for the Banking Fraud Knowledge Graph (DS2526). Shows 8 classes, object properties, data properties, disjoint axioms, and ontology IRI.</desc>

  <!-- Background -->
  <rect width="900" height="680" fill="#0D1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="6" height="680" fill="#F0A500"/>
  <text x="30" y="28" font-size="11" fill="#F0A500" font-weight="600" letter-spacing="2">OWL ONTOLOGY — CLASS HIERARCHY &amp; OBJECT PROPERTIES</text>
  <text x="30" y="46" font-size="10" fill="#8B949E">Banking Fraud Knowledge Graph · DS2526 · IRI: http://www.semanticweb.org/banking-fraud-kg#</text>

  <!-- ── LEGEND ── -->
  <rect x="30" y="58" width="840" height="30" rx="5" fill="#161B22" stroke="#2D3748" stroke-width="0.5"/>
  <rect x="44"  y="67" width="12" height="12" rx="2" fill="#1A3A5C" stroke="#58A6FF" stroke-width="1"/>
  <text x="61"  y="77" font-size="10" fill="#8B949E">Core entity</text>
  <rect x="130" y="67" width="12" height="12" rx="2" fill="#0A2818" stroke="#3FB950" stroke-width="1"/>
  <text x="147" y="77" font-size="10" fill="#8B949E">Transaction</text>
  <rect x="222" y="67" width="12" height="12" rx="2" fill="#1E1B3A" stroke="#7F77DD" stroke-width="1"/>
  <text x="239" y="77" font-size="10" fill="#8B949E">Fraud concept</text>
  <rect x="332" y="67" width="12" height="12" rx="2" fill="#2A1E00" stroke="#F0A500" stroke-width="1"/>
  <text x="349" y="77" font-size="10" fill="#8B949E">Format / type</text>
  <line x1="434" y1="73" x2="468" y2="73" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="474" y="77" font-size="10" fill="#8B949E">object property</text>
  <line x1="580" y1="68" x2="580" y2="82" stroke="#444" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="588" y="77" font-size="10" fill="#8B949E">subclass / disjoint</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── owl:Thing ── -->
  <rect x="370" y="100" width="160" height="36" rx="6" fill="#161B22" stroke="#444441" stroke-width="0.5"/>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#8B949E" font-family="'Courier New', monospace">owl:Thing</text>

  <!-- subclass line to Entity -->
  <line x1="450" y1="136" x2="450" y2="156" stroke="#444" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- ── Entity ── -->
  <rect x="360" y="156" width="180" height="44" rx="6" fill="#161B22" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#E6EDF3" font-weight="600">Entity</text>
  <text x="450" y="190" text-anchor="middle" font-size="10" fill="#8B949E">abstract superclass</text>

  <!-- disjoint note -->
  <text x="450" y="216" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic">⊥  all subclasses declared disjoint (owl:disjointWith)  ⊥</text>

  <!-- subclass connector lines -->
  <line x1="380" y1="200" x2="160" y2="248" stroke="#444" stroke-width="0.8" stroke-dasharray="4 2"/>
  <line x1="450" y1="200" x2="450" y2="248" stroke="#444" stroke-width="0.8" stroke-dasharray="4 2"/>
  <line x1="520" y1="200" x2="740" y2="248" stroke="#444" stroke-width="0.8" stroke-dasharray="4 2"/>

  <!-- ── Bank ── -->
  <rect x="60" y="248" width="200" height="44" rx="6" fill="#1A3A5C" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="160" y="266" text-anchor="middle" font-size="13" fill="#58A6FF" font-weight="600">Bank</text>
  <text x="160" y="282" text-anchor="middle" font-size="10" fill="#8B949E">financial institution</text>

  <!-- ── Transaction ── -->
  <rect x="340" y="248" width="220" height="44" rx="6" fill="#0A2818" stroke="#3FB950" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-size="13" fill="#3FB950" font-weight="600">Transaction</text>
  <text x="450" y="282" text-anchor="middle" font-size="10" fill="#8B949E">core event entity (hub)</text>

  <!-- ── Account ── -->
  <rect x="640" y="248" width="200" height="44" rx="6" fill="#1A3A5C" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="740" y="266" text-anchor="middle" font-size="13" fill="#58A6FF" font-weight="600">Account</text>
  <text x="740" y="282" text-anchor="middle" font-size="10" fill="#8B949E">bank account holder</text>

  <!-- ── Object properties: Transaction ↔ Account ── -->
  <!-- hasSenderAccount -->
  <line x1="560" y1="262" x2="638" y2="262" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="565" y="245" width="68" height="14" rx="3" fill="#0D1117"/>
  <text x="599" y="256" text-anchor="middle" font-size="9" fill="#58A6FF">hasSenderAccount</text>
  <!-- hasReceiverAccount -->
  <line x1="560" y1="278" x2="638" y2="278" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="558" y="278" width="76" height="14" rx="3" fill="#0D1117"/>
  <text x="596" y="289" text-anchor="middle" font-size="9" fill="#378ADD">hasReceiverAccount</text>

  <!-- belongsToBank: Account → Bank -->
  <path d="M640 262 L340 262" fill="none" stroke="#8B949E" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="none"/>
  <rect x="370" y="248" width="90" height="14" rx="3" fill="#0D1117"/>
  <text x="415" y="259" text-anchor="middle" font-size="9" fill="#8B949E">belongsToBank</text>

  <!-- ── Arrows from Transaction down to row 3 ── -->
  <!-- hasPaymentFormat -->
  <line x1="390" y1="292" x2="115" y2="388" stroke="#F0A500" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="218" y="355" text-anchor="middle" font-size="9" fill="#F0A500">hasPaymentFormat</text>
  <!-- hasCurrency -->
  <line x1="420" y1="292" x2="305" y2="388" stroke="#F0A500" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="350" text-anchor="middle" font-size="9" fill="#C07800">hasCurrency</text>
  <!-- hasFraudIndicator -->
  <line x1="480" y1="292" x2="565" y2="388" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="536" y="350" text-anchor="middle" font-size="9" fill="#7F77DD">hasFraudIndicator</text>
  <!-- belongsToPattern -->
  <line x1="510" y1="292" x2="765" y2="388" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="672" y="355" text-anchor="middle" font-size="9" fill="#534AB7">belongsToPattern</text>

  <!-- ── Row 3 — four concept classes ── -->
  <!-- PaymentFormat -->
  <rect x="30"  y="388" width="170" height="44" rx="6" fill="#2A1E00" stroke="#F0A500" stroke-width="1.5"/>
  <text x="115" y="406" text-anchor="middle" font-size="12" fill="#F0A500" font-weight="600">PaymentFormat</text>
  <text x="115" y="422" text-anchor="middle" font-size="10" fill="#8B949E">ACH, cash, card, wire…</text>

  <!-- Currency -->
  <rect x="220" y="388" width="170" height="44" rx="6" fill="#2A1E00" stroke="#C07800" stroke-width="1.5"/>
  <text x="305" y="406" text-anchor="middle" font-size="12" fill="#C07800" font-weight="600">Currency</text>
  <text x="305" y="422" text-anchor="middle" font-size="10" fill="#8B949E">USD, EUR, BTC…</text>

  <!-- FraudIndicator -->
  <rect x="470" y="388" width="190" height="44" rx="6" fill="#1E1B3A" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="565" y="406" text-anchor="middle" font-size="12" fill="#7F77DD" font-weight="600">FraudIndicator</text>
  <text x="565" y="422" text-anchor="middle" font-size="10" fill="#8B949E">isLaundering flag</text>

  <!-- LaunderingPattern -->
  <rect x="680" y="388" width="190" height="44" rx="6" fill="#1E1B3A" stroke="#534AB7" stroke-width="1.5"/>
  <text x="775" y="406" text-anchor="middle" font-size="12" fill="#534AB7" font-weight="600">LaunderingPattern</text>
  <text x="775" y="422" text-anchor="middle" font-size="10" fill="#8B949E">FanOut · Cycle · GatherScatter</text>

  <!-- ── Data properties panel ── -->
  <rect x="30" y="470" width="840" height="130" rx="8" fill="#161B22" stroke="#2D3748" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text x="46" y="492" font-size="11" fill="#F0A500" font-weight="600">Data properties</text>

  <!-- Transaction data properties -->
  <text x="46"  y="514" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasAmountPaid</text>
  <text x="46"  y="530" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:decimal</text>
  <text x="246" y="514" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasAmountReceived</text>
  <text x="246" y="530" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:decimal</text>
  <text x="476" y="514" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasTimestamp</text>
  <text x="476" y="530" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:dateTime</text>
  <text x="676" y="514" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">isLaundering</text>
  <text x="676" y="530" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:boolean</text>

  <line x1="46" y1="540" x2="854" y2="540" stroke="#2D3748" stroke-width="0.5"/>

  <text x="46"  y="558" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasAccountID</text>
  <text x="46"  y="574" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:string  (Account)</text>
  <text x="276" y="558" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasBankID</text>
  <text x="276" y="574" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:string  (Bank)</text>
  <text x="476" y="558" font-size="10" fill="#E6EDF3" font-family="'Courier New', monospace">hasPatternType</text>
  <text x="476" y="574" font-size="9"  fill="#8B949E" font-family="'Courier New', monospace">xsd:string  (LaunderingPattern)</text>

  <!-- ── Footer ── -->
  <text x="450" y="622" text-anchor="middle" font-size="9" fill="#555">All 8 classes declared disjoint · HermiT reasoner result: STABLE — no inconsistencies, no spurious inferences</text>
  <text x="450" y="638" text-anchor="middle" font-size="9" fill="#555">Ontology IRI: http://www.semanticweb.org/banking-fraud-kg#  ·  DS2526 Data Semantics · UNIMIB · Victoria Bassey 948253</text>
  <text x="450" y="656" text-anchor="middle" font-size="9" fill="#444">github.com/vkybassey2021/banking-fraud-knowledge-graph</text>

</svg>
